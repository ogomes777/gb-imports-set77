<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffffff"/><stop offset=".32" stop-color="#f8f8f5"/>
    <stop offset=".69" stop-color="#ecebe5"/><stop offset="1" stop-color="#fafaf6"/>
  </linearGradient>
  <radialGradient id="haze" cx=".52" cy=".42" r=".72">
    <stop stop-color="#ffffff" stop-opacity=".88"/>
    <stop offset=".55" stop-color="#ffffff" stop-opacity=".25"/>
    <stop offset="1" stop-color="#d4cbbb" stop-opacity=".23"/>
  </radialGradient>
  <linearGradient id="glaze" x1="0" y1=".2" x2="1" y2=".7">
    <stop stop-color="#fff" stop-opacity=".82"/>
    <stop offset=".28" stop-color="#edeae1" stop-opacity=".32"/>
    <stop offset=".53" stop-color="#fff" stop-opacity=".64"/>
    <stop offset=".76" stop-color="#e1e0dc" stop-opacity=".22"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".61"/>
  </linearGradient>
  <linearGradient id="bevel" x1="0" y1="0" x2=".9" y2="1">
    <stop stop-color="#fff" stop-opacity=".92"/>
    <stop offset=".4" stop-color="#d6cab4" stop-opacity=".24"/>
    <stop offset=".6" stop-color="#fff" stop-opacity=".79"/>
    <stop offset="1" stop-color="#cfc9bd" stop-opacity=".14"/>
  </linearGradient>
  <radialGradient id="champagne">
    <stop stop-color="#d7ba81" stop-opacity=".22"/>
    <stop offset=".58" stop-color="#e6d6b2" stop-opacity=".10"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <filter id="frost" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="42"/>
  </filter>
  <filter id="silk" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#pearl)"/>
<rect width="1600" height="900" fill="url(#haze)"/>
