name: GB Imports | Showroom Neon Arrival V49
on:
  push:
    branches: [feat/gb-showroom-neon-v49]
  pull_request:
    branches: [feat/gb-cold-room-bidirectional-v48, main]
    paths:
      - 'gb-showroom-entrance-v49.*'
      - 'tests/showroom-neon-v49.mjs'
      - 'index.html'
permissions:
  contents: read
jobs:
  test-showroom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install chromium
      - name: Build GB Imports with preserved cinematic intro
        run: node scripts/build.mjs
      - name: Test neon rise, product swap, mobile and reduced-motion
        run: |
          python3 -m http.server 8080 --directory dist >/tmp/gb-showroom-v49-server.log 2>&1 &
          sleep 2
          node tests/showroom-neon-v49.mjs
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gb-showroom-neon-v49-desktop-mobile
          path: tmp/gb-showroom-v49/*.png
          if-no-files-found: ignore
          retention-days: 7
