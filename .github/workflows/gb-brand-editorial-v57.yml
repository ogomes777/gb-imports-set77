name: GB Imports | Brand Editorial V57 QA
on:
  push:
    branches: [feat/gb-brand-editorial-v57]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and prepare Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install chromium
          npm run build
          node scripts/validar-crt.mjs
      - name: Test editorial action rail and responsive typography
        run: |
          python3 -m http.server 8080 --directory dist >/tmp/gb-v57-http.log 2>&1 &
          sleep 2
          node tests/gb-brand-editorial-v57.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gb-brand-v57-mobile-desktop
          path: tmp/gb-editorial-v57/*.png
          if-no-files-found: ignore
          retention-days: 7
