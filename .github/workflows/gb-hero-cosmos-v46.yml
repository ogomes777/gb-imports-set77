name: GB Imports | Hero Cosmos V46
on:
  push:
    branches: [feat/gb-hero-cosmos-v46]
  pull_request:
    branches: [main]
    paths:
      - 'v07.js'
      - 'gb-hero-cosmos-v46.js'
      - 'gb-hero-cosmos-v46.css'
      - 'index.html'
      - 'tests/hero-cosmos-v46.mjs'
permissions:
  contents: read
jobs:
  hero:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependencies and browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install chromium
      - name: Build original storefront with V46
        run: node scripts/build.mjs
      - name: Run original hero, cosmic strokes, mobile and catalog QA
        run: |
          python3 -m http.server 8080 --directory dist > /tmp/gb-hero-v46-http.log 2>&1 &
          sleep 2
          node tests/hero-cosmos-v46.mjs
