name: GB Imports | Lux Steps V55 QA
on:
  push:
    branches: [feat/gb-lux-steps-v55]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v55:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and compile
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install chromium
          npm run build
          node scripts/validar-crt.mjs
      - name: Six viewport golden connection and accessibility QA
        run: |
          python3 -m http.server 8080 --directory dist >/tmp/gb-v55.log 2>&1 &
          sleep 2
          node tests/gb-lux-steps-v55.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gb-lux-steps-v55
          path: tmp/gb-lux-steps-v55/*.png
          if-no-files-found: ignore
          retention-days: 7
