name: GB Imports V59 Buyer Journey QA
on:
  push:
    branches: [feat/gb-human-copy-v59]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install, build and browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install chromium
          npm run build
          node scripts/validar-crt.mjs
      - name: Test copy, links, translations, layout and reduced motion
        run: |
          python3 -m http.server 8080 --directory dist >/tmp/gb-v59-server.log 2>&1 &
          sleep 2
          node tests/gb-human-copy-v59.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gb-v59-mobile-visual-check
          path: tmp/gb-v59/*.png
          if-no-files-found: ignore
          retention-days: 7
