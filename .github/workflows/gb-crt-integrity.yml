name: GB Imports / CRT catalogue integrity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/gb-imports-produtos-crt-01]
jobs:
  catalogue-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CRT files, product references and import ordering
        run: node scripts/validar-crt.mjs
      - name: Build flagship website
        run: node scripts/build.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: End-to-end desktop and mobile regression
        run: |
          python3 -m http.server 8080 --directory dist > /tmp/gb-http.log 2>&1 &
          sleep 2
          node tests/e2e.mjs http://127.0.0.1:8080/
